<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MarketHub — a secure online marketplace. Browse, search and buy products with confidence.">
  <title>MarketHub — Online Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ======================= Header / Navigation ======================= -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#/home" class="logo" aria-label="MarketHub home">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Market<em>Hub</em></span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/security" data-nav="security">Security</a>
        <a href="#/testing" data-nav="testing">Testing</a>
        <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
      </nav>

      <div class="header-actions">
        <a href="#/cart" class="icon-btn" aria-label="View cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
          </svg>
          <span class="cart-badge" id="cart-count" hidden>0</span>
        </a>
        <div id="auth-area"><!-- rendered by app.js --></div>
        <button class="icon-btn burger" id="burger" aria-label="Toggle menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ======================= App views (rendered by JS) ======================= -->
  <main id="view-root" class="container" tabindex="-1"></main>

  <!-- ======================= Footer ======================= -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p><strong>MarketHub</strong> — a secure online marketplace built with Node.js, Express &amp; SQLite.</p>
      <p class="muted">Passwords are bcrypt-hashed · Sessions are server-side · All queries are parameterized</p>
      <p><a href="#/security">Security overview</a> · <a href="#/testing">Testing report</a></p>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
